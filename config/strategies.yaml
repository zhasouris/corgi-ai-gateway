# Frontier-then-optimize routing (ADR 0017). One shared capability score `Q`
# builds the top cluster (frontier) for the task; each strategy then optimizes a
# single objective WITHIN that frontier. There are no per-strategy weighted sums.

# Capability weights — the "how good is this model for this task" score Q.
# Quality-family rules only; cost/latency are deliberately NOT in Q (that is the
# whole point — capability is decided before price/speed).
capability_weights:
  complexity: 3.0
  reasoning_depth: 2.0
  task_type: 3.0 # per-task competency (ADR 0010) — the core quality signal
  data_sensitivity: 0.3

# Frontier (top cluster) width: a model is in the frontier when
# Q >= Q_max * (1 - frontier_delta). This is the "good enough" band used by
# value/fast. Loose → they may trade a little capability for savings/speed.
frontier_delta: 0.12

# Tie-band width for `best`: models within Q_max * (1 - tie_epsilon) of the top
# are treated as statistically TIED (Q differences this small are benchmark
# noise), so `best` takes the cheapest of them rather than paying more for a
# meaningless edge. It only pays up when a model is >tie_epsilon better.
tie_epsilon: 0.05

# Each strategy → the objective it optimizes within the frontier.
# Each strategy → the objective it optimizes. Two axes (ADR 0021): the objective
# (capability / cost / latency) and whether it is gated to the capability frontier
# (`-capable`) or ranges over ALL eligible models (the bare `cheapest`/`fastest`).
strategies:
  best: capability # the frontier top — strongest model, price-blind
  cheapest-capable: cost # cheapest model IN the capability frontier
  cheapest: cost # cheapest eligible model — no capability gate
  fastest-capable: latency # fastest model IN the capability frontier
  fastest: latency # fastest eligible model — no capability gate
  # Deprecated aliases (ADR 0021), kept so old callers never break.
  value: cost # = cheapest-capable
  fast: latency # = fastest-capable

# Frontier width per strategy — a width of 1.0 means "no capability gate": the
# objective is optimized over EVERY eligible model, not just the frontier. Any
# strategy absent here uses the shared `frontier_delta` above.
strategy_frontier_delta:
  cheapest: 1.0
  fastest: 1.0
